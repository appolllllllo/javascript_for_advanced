<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Блокнот</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="notebook">
        <aside>
            <button id="new-note">Новая запись</button>
            <ul id="notes"></ul>
        </aside>
        <main>
            <input id="note-title" placeholder="Название записи">
            <textarea id="note-text" placeholder="Текст записи..."></textarea>
            <button id="save-note">Сохранить</button>
            <button id="delete-note">Удалить</button>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
